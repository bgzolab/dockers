# Git with a cup of tea, painless self-hosted git service
# https://github.com/go-gitea/gitea
services:
  gitea:
    image: gitea/gitea:1
    container_name: gitea
    restart: unless-stopped
    environment:
      # 容器内文件归属本地用户，避免 git 仓库目录出现 root 属主
      - USER_UID=${PUID:-1000}
      - USER_GID=${PGID:-1000}
      - GITEA__server__DOMAIN=${LAN:-192.168.31.20}
      - GITEA__server__ROOT_URL=http://${LAN:-192.168.31.20}:8004/
      - GITEA__server__SSH_DOMAIN=${LAN:-192.168.31.20}
      - GITEA__server__SSH_PORT=2222
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    ports:
      - "8004:3000"
      - "2222:22"
