# Telegram channel to RSS
# https://github.com/aigoncharov/telegram-to-rss
services:
   telegram-to-rss:
      image: aigoncharov/telegram-to-rss:latest
      container_name: telegram-to-rss
      restart: always
      environment:
        - TG_API_ID=${TG_API_ID}
        - TG_API_HASH=${TG_API_HASH}
        - TG_PASSWORD=${TG_PASSWORD}
        - BASE_URL=http://${LAN}:3042
        # - http_proxy=http://192.168.31.20:10800
        # - https_proxy=http://192.168.31.20:10800
        # - all_proxy=http://192.168.31.20:10800
      # host 网络：端口由应用自己监听，不需要 ports
      volumes:
        - ./data:/data
      network_mode: host
      # 启用透明代理（TProxy）
      

volumes:
   data: null

networks: {}
