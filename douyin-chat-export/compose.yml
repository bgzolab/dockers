# Export Douyin chat history and browse it locally
# https://github.com/TeamBreakerr/douyin-chat-export
services:
  douyin-chat-export:
    # ghcr.nju.edu.cn mirror: ghcr.io is slow/unreachable from this host
    image: ghcr.nju.edu.cn/teambreakerr/douyin-chat-export:latest
    container_name: douyin-chat-export
    ports:
      - "8022:8000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      # Docker injects its own (dead) HTTP(S)_PROXY into containers; clear it
      # so Playwright's Chromium connects directly. Drop these once
      # /etc/systemd/system/docker.service.d/proxy.conf is cleaned up.
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - ALL_PROXY=
      - all_proxy=
      - NO_PROXY=*
    restart: unless-stopped
